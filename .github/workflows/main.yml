name: Dev build

on:
  push:
    branches: [ "dev" ]

  workflow_dispatch:

jobs:
  build-deploy:
    name: build and deploy
    runs-on: ubuntu-24.04
    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: setup jdk 21
        uses: actions/setup-java@v4.7.0
        with:
          distribution: 'corretto'
          java-version: 21

      - name: unit tests
        run: ./gradlew test

      - name: build the app
        run: ./gradlew clean bootJar

      - name: build the docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          dockerfile: Dockerfile
          push: false
          tags: rut-miit/messenger:latest