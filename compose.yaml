services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    volumes:
      - './src/main/resources/db-script/create_script.sql:/docker-entrypoint-initdb.d/init.sql'

  ldap:
    image: 'bitnami/openldap:latest'
    ports:
      - '1389:1389'
      #- '1636:1636'
    environment:
      - LDAP_ROOT=dc=springframework,dc=org
      - LDAP_ADMIN_USERNAME=admin
      - LDAP_ADMIN_PASSWORD=admin
    volumes:
      - ./src/test/resources/ldifs:/ldifs

  application:
    image: 'rut-miit/messenger'
    build: .
    ports:
      - '8080:8080'
    environment:
      - SPRING_PROFILES_ACTIVE=rundev
    depends_on:
      - postgres
      - ldap
    profiles:
      - run
